plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.usageguard'
version = '0.1.0'

android {
  namespace "expo.modules.usageguard"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The 15-minute heartbeat and watchdog, which run without React Native and survive reboots.
  implementation "androidx.work:work-runtime:2.10.0"
}
