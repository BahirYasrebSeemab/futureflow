appId: com.bahiryasreb.futureflow
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Pair this phone'
    timeout: 30000
- takeScreenshot: 01-pair
- tapOn:
    id: 'setup-code'
- inputText: 'e2e-setup-code-0123456789'
- hideKeyboard
- tapOn:
    id: 'pair-button'
- extendedWaitUntil:
    visible:
      id: 'balance'
    timeout: 30000
- assertVisible: 'Time left'
- takeScreenshot: 02-today
- tapOn:
    id: 'diagnostics-link'
- assertVisible: 'Waiting to send'
- takeScreenshot: 03-diagnostics
- back
- tapOn:
    id: 'open-plan'
- tapOn:
    id: 'plan-tomorrow'
- tapOn:
    id: 'propose'
- extendedWaitUntil:
    visible: 'From your roadmap'
    timeout: 20000
- takeScreenshot: 04-plan-draft
- scrollUntilVisible:
    element:
      id: 'lock-plan'
- tapOn:
    id: 'lock-plan'
- tapOn: '(?i)^lock$'
- extendedWaitUntil:
    visible: 'Locked at.*'
    timeout: 20000
- takeScreenshot: 05-plan-locked
- back
- tapOn:
    id: 'bad-day'
- tapOn: '(?i)^yes, bad day$'
- extendedWaitUntil:
    visible: 'Bad day: 2-minute versions count'
    timeout: 20000
- takeScreenshot: 06-bad-day
