appId: com.bahiryasreb.futureflow
---
- launchApp:
    clearState: true
# A slow CI emulator sometimes shows "<system app> isn't responding" over our app: wait it out.
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: 'Wait'
- extendedWaitUntil:
    visible: 'Pair this phone'
    timeout: 30000
- takeScreenshot: 01-pair
- tapOn:
    id: 'setup-code'
- inputText: 'e2e-setup-code-0123456789'
- hideKeyboard
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: 'Wait'
- tapOn:
    id: 'pair-button'
- extendedWaitUntil:
    visible:
      id: 'balance'
    timeout: 30000
- assertVisible: 'Time left'
- takeScreenshot: 02-today
- tapOn:
    id: 'diagnostics-link'
- assertVisible: 'Waiting to send'
- takeScreenshot: 03-diagnostics
- back
- tapOn:
    id: 'open-plan'
- tapOn:
    id: 'plan-tomorrow'
- tapOn:
    id: 'propose'
- extendedWaitUntil:
    visible: 'From your roadmap'
    timeout: 20000
- takeScreenshot: 04-plan-draft
# scrollUntilVisible misjudged the Lock button on this emulator, so scroll well past the end
# (extra scrolls at the end do nothing; Android lists only on-screen elements).
- scroll
- scroll
- scroll
- scroll
- scroll
- scroll
- scroll
- scroll
- tapOn:
    id: 'lock-plan'
- tapOn: '(?i)^lock$'
- extendedWaitUntil:
    visible: 'Locked at.*'
    timeout: 20000
- takeScreenshot: 05-plan-locked
- back
- tapOn:
    id: 'bad-day'
- tapOn: '(?i)^yes, bad day$'
- extendedWaitUntil:
    visible: 'Bad day: 2-minute versions count'
    timeout: 20000
- takeScreenshot: 06-bad-day
- tapOn:
    id: 'open-math'
- tapOn:
    id: 'skip-placement'
- extendedWaitUntil:
    visible: 'Worked example.*'
    timeout: 20000
- takeScreenshot: 06b-worked-example
- tapOn:
    id: 'skip-example'
- extendedWaitUntil:
    visible:
      id: 'problem-prompt'
    timeout: 20000
- takeScreenshot: 07-practice
- tapOn:
    id: 'answer-input'
- inputText: '-1'
- hideKeyboard
- tapOn:
    id: 'check'
- extendedWaitUntil:
    visible: 'Not quite.*'
    timeout: 20000
- takeScreenshot: 08-feedback
- scroll
- scroll
- tapOn:
    id: 'open-mocks'
- extendedWaitUntil:
    visible:
      id: 'mock-L0'
    timeout: 20000
- takeScreenshot: 09-mocks
- tapOn:
    id: 'mock-L0'
- extendedWaitUntil:
    visible: 'Question 1 of.*'
    timeout: 20000
- takeScreenshot: 10-mock-question
- back
- tapOn: '(?i)^leave$'
- back
- back
- tapOn:
    id: 'open-coach'
- tapOn:
    id: 'coach-input'
- inputText: 'How do I start today?'
- hideKeyboard
- tapOn:
    id: 'coach-send'
# CI's Worker has no AI key, so the coach can't answer: the fixed safety line must show.
- extendedWaitUntil:
    visible:
      id: 'coach-unavailable'
    timeout: 30000
- takeScreenshot: 11-coach-unavailable
- back
- tapOn:
    id: 'open-more'
- takeScreenshot: 12-more
- tapOn:
    id: 'more-roadmap'
- extendedWaitUntil:
    visible: 'Software engineer'
    timeout: 20000
- takeScreenshot: 13-roadmap
