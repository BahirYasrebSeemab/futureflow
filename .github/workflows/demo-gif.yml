name: Demo GIF

# Rebuilds the README's demo GIF from the branch's latest passing Android e2e screenshots, in a
# minute, whenever the GIF script changes (or on demand once this file is on main).
on:
  pull_request:
    paths:
      - 'apps/mobile/e2e/demo-gif.sh'
      - '.github/workflows/demo-gif.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the latest passing emulator screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          run=$(gh run list --workflow "Android e2e" --branch "$BRANCH" --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run" ]; then echo "No passing Android e2e run on $BRANCH"; exit 1; fi
          echo "From run $run"
          gh run download "$run" -n android-e2e -D .
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: apps/mobile/e2e/demo-gif.sh e2e-out
      - uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: e2e-out/demo.gif
