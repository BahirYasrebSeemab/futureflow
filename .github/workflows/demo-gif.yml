name: Demo GIF

# Rebuilds the README's demo GIF from an earlier Android e2e run's screenshots, in a minute.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'An Android e2e run id with the android-e2e artifact'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-e2e
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: apps/mobile/e2e/demo-gif.sh e2e-out
      - uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: e2e-out/demo.gif
