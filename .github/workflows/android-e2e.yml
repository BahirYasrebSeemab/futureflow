name: Android e2e

# Builds a release APK, starts the Worker locally, and drives the app on an emulator with Maestro.
# Screenshots land in the android-e2e artifact. It takes about 25 minutes, so it runs on demand
# (`gh workflow run "Android e2e" --ref <branch>`) and when a PR is marked ready, not on every push.
on:
  pull_request:
    types: [ready_for_review]
    paths:
      - 'apps/mobile/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'bun.lock'
      - '.github/workflows/android-e2e.yml'
  workflow_dispatch:

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The runner's disk can't hold node_modules, a Gradle build and an emulator image at once.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # No Gradle cache: the android/ folder only exists after `expo prebuild`.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile

      - name: Start the Worker locally (throwaway setup code)
        working-directory: apps/api
        run: |
          printf 'SETUP_CODE=e2e-setup-code-0123456789\n' > .dev.vars
          bun run migrate:local
          bun x wrangler d1 execute futureflow --local --file ../mobile/e2e/seed-roadmap.sql
          nohup bun x wrangler dev --port 8787 > ../../wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/v1/today || true)
            if [ "$code" = "401" ]; then echo "Worker up"; exit 0; fi
            sleep 2
          done
          echo "Worker did not start"; cat ../../wrangler.log; exit 1

      - name: Build the release APK for the emulator
        working-directory: apps/mobile
        env:
          E2E: '1'
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8787
        run: |
          bun x expo prebuild --platform android --no-install
          cd android && ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Drop build leftovers, keeping the APK
        run: |
          rm -rf apps/mobile/android/app/build/intermediates apps/mobile/android/app/.cxx \
            apps/mobile/android/build ~/.gradle/caches
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro (pinned)
        env:
          MAESTRO_VERSION: '2.11.0'
        run: curl -fsSL https://get.maestro.mobile.dev | bash

      - name: Run Maestro on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./apps/mobile/e2e/run.sh

      # The README's demo: a fixed set of screenshots, 2 s each.
      - name: Make the demo GIF
        if: success()
        run: |
          command -v convert > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null)
          apps/mobile/e2e/demo-gif.sh e2e-out

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: |
            e2e-out/
            wrangler.log
          if-no-files-found: warn
