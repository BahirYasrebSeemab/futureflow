name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run coverage

  # The guard's pure Kotlin logic on a plain JVM (JUnit). Quick, and needs no Android build.
  guard-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle -p apps/mobile/modules/usage-guard/logic-tests test --no-daemon

  android-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Bundle for Android (Metro + Hermes)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid
        run: |
          bun x expo export --platform android --output-dir dist-android
          find dist-android -name '*.hbc' -printf '%s bytes %p\n'
          test -n "$(find dist-android -name '*.hbc')"
